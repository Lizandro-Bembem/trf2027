<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Retiro Transformados</title>
    <meta name="description" content="Retiro Transformados - TRF 2027. Santidade em uma geração corrompida.">

    <!-- Configuração PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4A121A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TRF 2027">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root{--bg-primary:#FFFFFF;--bg-secondary:#F8F9FA;--bg-accent:#F4ECE1;--text-main:#1C100C;--text-muted:#665C58;--brand-wine:#4A121A;--brand-gold:#C5A880;--brand-brown:#2D1115;--border-color:#E2DDD9}
        *{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{font-family:'Montserrat',sans-serif;background:var(--bg-primary);color:var(--text-main);line-height:1.6;overflow-x:hidden}
        h1,h2,h3,.serif-title{font-family:'Cinzel',serif}
        @keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .animate-fade{animation:fadeIn .6s ease-out forwards}

        header{position:fixed;top:0;left:0;width:100%;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-color);z-index:1000;display:flex;justify-content:space-between;align-items:center;padding:.8rem 3%;padding-top:calc(.8rem + env(safe-area-inset-top,0px));gap:.5rem}

        /* Logo ajustada para sumir no celular se necessário ou ficar limpa */
        .logo{font-size:1rem;font-weight:700;color:var(--brand-wine);letter-spacing:1px;text-transform:uppercase;white-space:nowrap;line-height:1.2}

        nav ul{display:flex;list-style:none;gap:1.5rem;align-items:center}
        nav ul li a{text-decoration:none;color:var(--text-main);font-weight:500;font-size:.9rem;transition:color .3s}
        nav ul li a:hover,nav ul li a.active{color:var(--brand-wine);font-weight:600}
        .mobile-only{display:none}
        .menu-toggle{display:none;background:var(--bg-accent);border:1px solid var(--brand-gold);color:var(--brand-wine);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:.9rem}
        .header-actions{display:flex;gap:.4rem;align-items:center;position:relative}
        .btn-social{background:var(--bg-secondary);color:var(--brand-wine);border:1px solid var(--border-color);padding:.4rem .7rem;border-radius:20px;text-decoration:none;font-weight:600;font-size:.8rem;display:inline-flex;align-items:center;gap:.3rem;transition:all .3s}
        .btn-social:hover{border-color:var(--brand-wine)}
        .btn-auth{background:var(--brand-wine);color:#fff;padding:.45rem .8rem;border-radius:20px;text-decoration:none;font-weight:600;font-size:.8rem;border:none;cursor:pointer;transition:background .3s;font-family:inherit;white-space:nowrap}
        .btn-auth:hover{background:var(--brand-brown)}
        .btn-auth.gold{background:var(--brand-gold);color:var(--brand-brown)}

        .user-menu-container{position:relative;display:inline-block}
        .user-greeting-btn{font-weight:700;color:var(--brand-wine);font-size:.85rem;font-family:inherit;background:var(--bg-accent);border:1px solid var(--brand-gold);padding:.35rem .8rem;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:.4rem;max-width:140px}
        .user-greeting-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .user-dropdown-menu{display:none;position:absolute;right:0;top:110%;background:#fff;min-width:140px;box-shadow:0 10px 25px rgba(0,0,0,.1);border:1px solid var(--border-color);border-radius:12px;z-index:1100;overflow:hidden}
        .user-dropdown-menu button{width:100%;padding:.8rem 1rem;text-align:left;background:none;border:none;font-size:.9rem;font-weight:600;font-family:inherit;color:#c62828;cursor:pointer;transition:background .2s}
        .user-dropdown-menu button:hover{background:#ffebee}

        .cart-icon-btn{position:relative;background:var(--bg-accent);border:1px solid var(--brand-gold);color:var(--brand-wine);padding:.4rem .7rem;border-radius:20px;cursor:pointer;font-weight:600;font-size:.8rem;font-family:inherit;display:inline-flex;align-items:center;gap:.3rem}
        .cart-badge{background:var(--brand-wine);color:#fff;font-size:.65rem;padding:.1rem .35rem;border-radius:50px;min-width:1.1rem;text-align:center}

        .page-section{display:none;min-height:85vh;padding-top:7rem;padding-bottom:4rem}
        .page-section.active-page{display:block;animation:fadeIn .5s ease-out forwards}

        /* Hero com espaçamento superior correto para não cortar nada em celulares */
        .hero {
            position: relative;
            padding: 4rem 5%;
            margin-top: 1rem;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.92) 0%, rgba(244, 236, 225, 0.88) 100%), url('banner.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 3rem;
            min-height: 85vh;
        }
        .hero-content{max-width:600px}
        .hero-badge{display:inline-block;background:var(--brand-gold);color:var(--brand-brown);padding:.4rem 1rem;border-radius:20px;font-size:.85rem;font-weight:700;margin-bottom:1.5rem;letter-spacing:1px;text-transform:uppercase}
        .hero h1{font-size:3.2rem;color:var(--brand-wine);line-height:1.1;margin-bottom:1.5rem}
        .hero p{font-size:1.05rem;color:var(--text-muted);margin-bottom:2rem}
        .btn-primary{background:var(--brand-wine);color:#fff;padding:.9rem 1.8rem;border-radius:50px;text-decoration:none;font-weight:600;font-family:inherit;font-size:.95rem;display:inline-flex;align-items:center;gap:.5rem;box-shadow:0 10px 20px rgba(74,18,26,.15);transition:transform .3s,background .3s;border:none;cursor:pointer}
        .btn-primary:hover{background:var(--brand-brown);transform:translateY(-2px)}
        .btn-primary:disabled{opacity:.6;cursor:wait;transform:none}
        .hero-card-preview{background:#fff;padding:3.5rem 3rem;border-radius:32px;box-shadow:0 30px 60px rgba(74,18,26,.15);border:3px solid var(--brand-gold);text-align:center;max-width:450px;width:100%;animation:float 4s ease-in-out infinite}
        .hero-card-preview h3{color:var(--brand-wine);margin-bottom:.8rem;font-size:2.3rem}
        .hero-card-preview p{color:var(--text-main);font-size:1.25rem;font-weight:700;margin-bottom:1.5rem}
        .badge-esgotado{font-size:1rem;color:var(--brand-wine);background:var(--bg-accent);padding:.6rem 1.2rem;border-radius:20px;font-weight:700;text-transform:uppercase;display:inline-block}

        .nubank-banner{margin:3rem 5%;background:linear-gradient(135deg,var(--brand-wine) 0%,var(--brand-brown) 100%);border-radius:24px;padding:3.5rem 3rem;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:2rem;box-shadow:0 20px 40px rgba(0,0,0,.1)}
        .nubank-banner h2{font-size:2.3rem;margin-bottom:1rem;color:var(--bg-accent)}
        .nubank-banner p{color:rgba(255,255,255,.85);font-size:1.05rem;margin-bottom:1.5rem}
        .banner-img-box{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:2.5rem;border-radius:20px;text-align:center;min-width:300px;font-weight:600;color:var(--bg-accent)}

        .section-about{padding:3rem 5%;max-width:1200px;margin:0 auto}
        .section-about .nubank-banner{margin-left:0;margin-right:0}
        .eyebrow{color:var(--brand-gold);font-weight:700;text-transform:uppercase;font-size:.85rem}
        .quem-somos-grid{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:center;margin-bottom:4rem}
        .fotos-espalhadas{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
        .foto-card-mock{background:var(--bg-accent);border:1px solid var(--border-color);height:180px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--brand-wine);font-size:.9rem;text-align:center;padding:1rem}
        .features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2rem;margin-top:2rem}
        .feature-item{background:#fff;padding:2.5rem 2rem;border-radius:20px;border:1px solid var(--border-color);transition:transform .3s}
        .feature-item:hover{transform:translateY(-5px)}
        .feature-item i{font-size:2rem;color:var(--brand-gold);margin-bottom:1.2rem}
        .feature-item h3{font-size:1.2rem;color:var(--brand-wine);margin-bottom:.8rem}

        .experiencia-content{max-width:1000px;margin:0 auto;padding:3rem 5%;text-align:center}
        .experiencia-destaque-box{background:var(--bg-secondary);border:2px solid var(--brand-gold);border-radius:24px;padding:3rem;margin-top:2rem}
        .experiencia-texto-visivel{font-size:1.2rem;color:var(--text-main);font-weight:600;line-height:1.8;margin-top:1rem;margin-bottom:2rem}
        .foto-experiencia-grande{background:var(--brand-wine);color:var(--bg-accent);height:350px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.5rem;font-family:'Cinzel',serif;box-shadow:0 15px 35px rgba(74,18,26,.2)}

        .section-store{padding:2rem 5%;max-width:1300px;margin:0 auto}
        .products-grid{
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 produtos lado a lado em todas as telas */
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .product-card{background:#fff;border:1px solid var(--border-color);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
        .product-card{background:#fff;border:1px solid var(--border-color);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
        .product-img{background:var(--bg-secondary);height:220px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-weight:600;text-align:center;padding:1rem}
        .product-info{padding:1.5rem;display:flex;flex-direction:column;flex:1}
        .product-info h3{font-size:1.1rem;color:var(--text-main);margin-bottom:.5rem}
        .product-price{font-size:1.2rem;font-weight:700;color:var(--brand-wine);margin-bottom:1.2rem}
        .qty-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:1rem}
        .qty-row label{font-size:.8rem;font-weight:600;color:var(--text-muted)}
        .qty-input{width:84px;text-align:center;padding:.5rem;border:1px solid var(--brand-wine);border-radius:10px;font-size:16px;font-weight:700;font-family:inherit;color:var(--brand-wine);background:#fff;outline:none}
        .qty-input:focus{box-shadow:0 0 0 2px var(--brand-gold)}
        .product-buttons{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:auto}
        .btn-add-cart{background:var(--bg-secondary);color:var(--brand-wine);border:1px solid var(--brand-wine);padding:.7rem .5rem;border-radius:10px;font-size:.8rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all .3s;text-align:center}
        .btn-add-cart:hover{background:var(--bg-accent)}
        .btn-buy-now{background:var(--brand-wine);color:#fff;border:none;padding:.7rem .5rem;border-radius:10px;font-size:.8rem;font-weight:600;font-family:inherit;cursor:pointer;transition:background .3s;text-align:center}
        .btn-buy-now:hover{background:var(--brand-brown)}

        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);backdrop-filter:blur(5px);display:none;justify-content:center;align-items:center;z-index:2000;padding:1rem;overflow-y:auto}
        .modal-box{background:#fff;padding:2.5rem;border-radius:24px;max-width:450px;width:100%;max-height:100%;overflow-y:auto;box-shadow:0 25px 50px rgba(0,0,0,.2);position:relative;animation:fadeIn .3s ease-out;text-align:center}
        .modal-box h2{color:var(--brand-wine);margin-bottom:1.5rem;font-size:1.8rem}
        .modal-text{color:var(--text-muted);font-size:.95rem;margin:-.5rem 0 1.2rem}
        .form-group{margin-bottom:1.2rem;text-align:left}
        .form-group label{display:block;font-size:.85rem;font-weight:600;color:var(--text-muted);margin-bottom:.4rem}
        .form-group input{width:100%;padding:.8rem 1rem;border:1px solid var(--border-color);border-radius:12px;font-size:16px;font-family:inherit;outline:none;transition:border-color .3s}
        .form-group input:focus{border-color:var(--brand-wine)}
        .modal-close{position:absolute;top:1.2rem;right:1.5rem;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text-muted)}
        .link-btn{background:none;border:none;color:var(--brand-wine);font-weight:700;cursor:pointer;text-decoration:underline;font-family:'Montserrat',sans-serif}

        .cart-items-list{max-height:250px;overflow-y:auto;margin-bottom:1.5rem;border-top:1px solid var(--border-color);border-bottom:1px solid var(--border-color);padding:1rem 0;text-align:left}
        .cart-item-row{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.8rem;font-size:.9rem}
        .cart-item-info{flex:1;min-width:0}
        .qty-controls{display:inline-flex;align-items:center;gap:.4rem;margin-top:.2rem}
        .btn-qty{width:26px;height:26px;border-radius:50%;border:1px solid var(--brand-wine);background:#fff;color:var(--brand-wine);font-weight:700;cursor:pointer;line-height:1}
        .btn-remove-item{background:#ffebee;color:#c62828;border:none;padding:.3rem .6rem;border-radius:8px;font-size:.75rem;font-family:inherit;cursor:pointer;font-weight:600}
        .cart-footer{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;font-weight:700;font-size:1.1rem}

        .toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--brand-brown);color:#fff;padding:.8rem 1.4rem;border-radius:50px;font-size:.9rem;font-weight:600;z-index:3000;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:90%;text-align:center}
        .toast.show{opacity:1;transform:translate(-50%,0)}

        footer{background:var(--brand-brown);color:#fff;padding:3rem 5%;padding-bottom:calc(3rem + env(safe-area-inset-bottom,0px));text-align:center;margin-top:4rem}

        @media (max-width:768px){
            header{padding-left:3%;padding-right:3%;padding-top:calc(.6rem + env(safe-area-inset-top,0px));padding-bottom:.6rem}
            /* Oculta a bolinha da logo no mobile para liberar espaço */
            .logo img, .logo-img { display: none !important; }
            .logo{font-size:.75rem;letter-spacing:0;line-height:1.15;min-width:0;font-weight:700}
            .logo span{display:block}
            .menu-toggle{display:inline-flex;align-items:center;justify-content:center;order:-1;width:36px;height:36px;border-radius:8px;flex-shrink:0}
            .cart-header{display:none}
            .header-actions{gap:.3rem}
            .user-greeting-btn{max-width:110px;padding:.35rem .6rem;font-size:.75rem}
            nav{position:absolute;top:100%;left:0;width:100%;background:#fff;border-bottom:1px solid var(--border-color);display:none}
            nav.open{display:block}
            nav ul{flex-direction:column;align-items:stretch;gap:0;padding:.5rem 4% 1rem}
            nav ul li a{display:block;padding:.9rem 0;font-size:1rem;border-bottom:1px solid var(--bg-accent)}
            .mobile-only{display:list-item}
            .header-actions .btn-social{display:none}
            .hide-mobile{display:none}
            .btn-auth{padding:.4rem .55rem;font-size:.7rem}

            /* Ajuste crucial do hero para afastar o conteúdo debaixo do cabeçalho fixo */
            .hero{flex-direction:column;text-align:center;gap:2rem;padding:2.5rem 4%;margin-top:4.5rem;min-height:auto}
            .hero h1{font-size:2rem}
            .hero-card-preview{padding:2rem 1.2rem}
            .hero-card-preview h3{font-size:1.7rem}

            .quem-somos-grid{grid-template-columns:1fr}
            .nubank-banner{flex-direction:column;padding:2rem 1.5rem;text-align:center;margin:2rem 5%}
            .nubank-banner h2{font-size:1.7rem}
            .banner-img-box{min-width:0!important;width:100%;padding:2rem 1rem!important}
            .experiencia-destaque-box{padding:1.5rem}
            .foto-experiencia-grande{height:260px}
            .modal-box{padding:2rem 1.4rem}
        }
        @media (max-width:360px){.logo{font-size:.68rem}.btn-auth{padding:.35rem .45rem;font-size:.65rem}header{gap:.4rem}}
        @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    </style>
</head>
<body>

<header>
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
    <div class="logo"><span>Retiro</span> <span>Transformados</span></div>
    <nav id="mainNav">
        <ul>
            <li><a href="#home" onclick="showPage('home'); return false;" class="active" id="nav-home">Início</a></li>
            <li><a href="#sobre" onclick="showPage('sobre'); return false;" id="nav-sobre">O Retiro</a></li>
            <li><a href="#experiencia" onclick="showPage('experiencia'); return false;" id="nav-experiencia">Experiência</a></li>
            <li><a href="#loja" onclick="showPage('loja'); return false;" id="nav-loja">Lojinha TRF</a></li>
            <li class="mobile-only"><a href="#" onclick="openCartModal(); return false;"><i class="fa-solid fa-cart-shopping"></i> Carrinho <span class="cart-badge" id="cartCountMenu" style="margin-left:.3rem">0</span></a></li>
            <li class="mobile-only"><a href="https://www.instagram.com/retirotransformados" target="_blank" rel="noopener"><i class="fa-brands fa-instagram"></i> Instagram</a></li>
            <li class="mobile-only"><a href="#" onclick="openWhatsAppInfo(); return false;"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a></li>
            <li class="mobile-only" id="installItem" style="display:none"><a href="#" onclick="installApp(); return false;"><i class="fa-solid fa-download"></i> Instalar app</a></li>
        </ul>
    </nav>
    <div class="header-actions">
        <button class="cart-icon-btn cart-header" onclick="openCartModal()" aria-label="Abrir carrinho">
            <i class="fa-solid fa-cart-shopping"></i> <span class="hide-mobile">Carrinho</span> <span class="cart-badge" id="cartCount">0</span>
        </button>
        <a href="https://www.instagram.com/retirotransformados" target="_blank" rel="noopener" class="btn-social" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" onclick="openWhatsAppInfo(); return false;" class="btn-social" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
        <button class="btn-social hide-mobile" id="installBtn" style="display:none;cursor:pointer;font-family:inherit" onclick="installApp()" title="Instalar app"><i class="fa-solid fa-download"></i> Instalar</button>

        <div id="authButtonsContainer" style="display:flex;gap:.4rem;">
            <button class="btn-auth" onclick="openModal('loginModal')">Fazer login</button>
            <button class="btn-auth gold" onclick="openModal('registerModal')">Cadastre-se</button>
        </div>

        <div id="userGreetingContainer" style="display:none;" class="user-menu-container">
            <button class="user-greeting-btn" onclick="toggleUserMenu()">
                <span id="userNameDisplay"></span> <i class="fa-solid fa-chevron-down" style="font-size:.75rem;"></i>
            </button>
            <div class="user-dropdown-menu" id="userDropdownMenu">
                <button onclick="logoutUser()"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
            </div>
        </div>
    </div>
</header>
